<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Usage Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header with refresh button -->
  <header class="header">
    <h1>Claude Usage</h1>
    <button id="refresh-btn" class="refresh-btn" title="Refresh usage data">
      &#x21bb;
    </button>
  </header>

  <!-- Status bar: last updated + loading indicator -->
  <div class="status-bar">
    <span id="status-text">Loading...</span>
  </div>

  <!-- Main content area -->
  <div id="content">

    <!-- Error state (hidden by default) -->
    <div id="error-card" class="card error-card hidden">
      <div class="card-body center">
        <p class="error-text" id="error-text"></p>
        <p class="muted">Make sure you have a <strong>claude.ai</strong> tab open and are logged in.</p>
      </div>
    </div>

    <!-- Usage Overview: the main percentage bar(s) -->
    <div id="usage-section" class="hidden">

      <!-- Primary usage bar -->
      <div class="card">
        <div class="card-header">
          <h3>Usage</h3>
          <span class="plan-badge" id="plan-badge"></span>
        </div>
        <div class="card-body">
          <div id="usage-bars">
            <!-- Usage bars are dynamically rendered here -->
          </div>
        </div>
      </div>

      <!-- Rate limit status -->
      <div class="card" id="rate-limit-card">
        <div class="card-header">
          <h3>Rate Limits</h3>
        </div>
        <div class="card-body" id="rate-limit-body">
          <!-- Rate limit details rendered here -->
        </div>
      </div>

      <!-- Raw details (collapsible) -->
      <div class="card">
        <div class="card-header clickable" id="details-toggle">
          <h3>Details</h3>
          <span class="toggle-arrow" id="toggle-arrow">&#x25B6;</span>
        </div>
        <div class="card-body hidden" id="details-body">
          <pre id="details-json" class="details-json"></pre>
        </div>
      </div>
    </div>

    <!-- Usage history chart -->
    <div id="history-section" class="hidden">
      <div class="card">
        <div class="card-header">
          <h3>Usage History</h3>
        </div>
        <div class="card-body chart-container">
          <canvas id="history-chart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <script src="../lib/chart.min.js"></script>
  <script src="../utils/time.js"></script>
  <script src="popup.js"></script>
</body>
</html>
